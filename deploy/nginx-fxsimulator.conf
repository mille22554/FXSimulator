# FXSimulator: /FXSimulator/ -> 127.0.0.1:2641 (nginx strips the prefix)
#
# 2026-10-22：Cloudflare Tunnel 從邊緣到 nginx 一律是 http，所以 nginx 的 $scheme
# 永遠是 http，不能用它判斷使用者協定。改用 Cloudflare/cloudflared 帶進來的
# X-Forwarded-Proto（已實測：http 進站 = http、https 進站 = https）。
# 只把「使用者真的用 http」的請求 301 到 https，tunnel 內部請求不受影響（不會迴圈）。
location /FXSimulator/ {
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    proxy_pass http://127.0.0.1:2641/;
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # 傳遞使用者真正的協定（原本寫死 $scheme = http，會讓 app 誤判為明文）
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Host $host;

    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

location = /fxsimulator { return 301 /FXSimulator/; }
location = /FXSimulator  { return 301 /FXSimulator/; }
